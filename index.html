<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>З річницею</title>
  </head>
  <body>
    <main id="app">
      <canvas id="game"></canvas>
      <section id="start-screen" class="overlay">
        <div class="start-copy">
          <p class="eyebrow">маленька подорож спогадами</p>
          <h1>Знайди дати для наших моментів</h1>
          <button id="start-button" type="button">Почати</button>
        </div>
      </section>
      <section id="hud" class="hud">
        <div id="prompt" class="prompt"></div>
        <div id="progress" class="progress">0 / 6</div>
        <div id="mobile-stick" class="mobile-stick" aria-hidden="true">
          <div class="mobile-stick__knob"></div>
        </div>
        <button id="mobile-action" class="mobile-action" type="button" aria-label="Взаємодія">E</button>
      </section>
      <section id="final-message" class="final-message" aria-live="polite">
        <h2>З річницею, кохана ❤️</h2>
        <p>Дякую за кожен момент, який ми прожили разом.</p>
        <p>Це лише маленька частина того, що я хочу тобі подарувати.</p>
        <strong>Тепер час отримати це в реальному житті ❤️</strong>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
